<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Pal</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
  @property --n { syntax: '<integer>'; initial-value: 0; inherits: false; }

* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: #4b3f5c;
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  background: linear-gradient(160deg, #fdf1e6, #f6f0fb 50%, #eaf6f0) fixed;
}
.page { max-width: 700px; margin: 0 auto; padding: 80px 20px; text-align: center; }
.page h1 { font-size: 2.4rem; text-shadow: 3px 3px 0 #f9d3dc; }

/* ---------- loading screen ---------- */
#loader {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; overflow: hidden;
  background: linear-gradient(160deg, #fdf1e6, #f6f0fb 50%, #eaf6f0);
  animation: out .9s ease 2.75s forwards;
}
@keyframes out { to { opacity: 0; visibility: hidden; pointer-events: none; } }

#loader::before, #loader::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(70px); opacity: .6;
}
#loader::before { width: 380px; height: 380px; background: #f9c9d8; top: -110px; left: -90px; }
#loader::after  { width: 420px; height: 420px; background: #bfe8d0; bottom: -140px; right: -100px; }

/* mascot */
#loader .sc { position: relative; width: 150px; height: 140px; }
#loader .pot {
  width: 130px; height: 130px; position: absolute; left: 10px; bottom: 0;
  transform-origin: 50% 100%; animation: hop 1s ease-in-out infinite;
}
@keyframes hop {
  0%, 100% { transform: translateY(0) scale(1.05, .95); }
  45%      { transform: translateY(-20px) scale(.97, 1.04); }
}
#loader .shd {
  width: 70px; height: 10px; border-radius: 50%; background: #4b3f5c26; margin-top: 2px;
  animation: shd 1s ease-in-out infinite;
}
@keyframes shd {
  0%, 100% { transform: scaleX(1); opacity: 1; }
  45%      { transform: scaleX(.7); opacity: .5; }
}

/* falling drops + floating sparkles */
#loader .drop {
  position: absolute; top: -10px; font-size: 1.1rem; opacity: 0;
  animation: fall 1.6s ease-in infinite;
}
@keyframes fall {
  0%   { transform: translateY(0); opacity: 0; }
  20%  { opacity: 1; }
  80%  { opacity: .9; }
  100% { transform: translateY(70px); opacity: 0; }
}
#loader .sp { position: absolute; font-size: 1.4rem; animation: flt 3s ease-in-out infinite; }
@keyframes flt { 50% { transform: translateY(-14px) rotate(12deg); } }

/* title */
#loader .wm {
  color: #4b3f5c; font: 700 2.3rem/1 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  letter-spacing: -.5px; margin-top: 16px; text-shadow: 3px 3px 0 #f9d3dc;
}

/* progress bar */
#loader .ln {
  position: relative; width: 240px; height: 22px; margin: 22px 0 12px;
  border: 3px solid #4b3f5c; border-radius: 999px; background: #fff; overflow: hidden;
}
#loader .ln i {
  position: absolute; left: 0; top: 0; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, #9fd8f5, #c9b8f5);
  animation: fill 2.4s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes fill { to { width: 100%; } }

/* percentage counter (pure CSS) */
#loader .pc {
  color: #4b3f5c; font: 600 1rem 'Fredoka', system-ui, sans-serif;
  counter-reset: n var(--n);
  animation: count 2.4s cubic-bezier(.2, .7, .3, 1) forwards;
}
#loader .pc::after { content: counter(n) "%"; }
@keyframes count { to { --n: 100; } }

/* rotating messages */
#loader .msg {
  position: relative; width: 260px; height: 1.2em; margin-top: 6px;
  color: #4b3f5c; opacity: .65; font: 500 .9rem 'Fredoka', system-ui, sans-serif;
}
#loader .msg span {
  position: absolute; inset: 0; opacity: 0;
  animation-duration: 2.4s; animation-fill-mode: forwards; animation-timing-function: linear;
}
#loader .m1 { animation-name: m1; }
#loader .m2 { animation-name: m2; }
#loader .m3 { animation-name: m3; }
#loader .m4 { animation-name: m4; }
@keyframes m1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
@keyframes m2 { 0%, 24% { opacity: 0; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes m3 { 0%, 49% { opacity: 0; } 50%, 74% { opacity: 1; } 75%, 100% { opacity: 0; } }
@keyframes m4 { 0%, 74% { opacity: 0; } 75%, 100% { opacity: 1; } }

</style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <span class="sp" style="left:18%;top:22%">✨</span>
    <span class="sp" style="left:78%;top:28%;animation-delay:.6s">🌸</span>
    <span class="sp" style="left:26%;top:72%;animation-delay:1.1s">🍃</span>
    <span class="sp" style="left:72%;top:68%;animation-delay:.3s">✨</span>

    <div class="sc">
      <span class="drop" style="left:14%">💧</span>
      <span class="drop" style="left:46%;animation-delay:.5s">💧</span>
      <span class="drop" style="left:78%;animation-delay:1s">💧</span>
      <svg class="pot" viewBox="0 0 120 120">
        <path d="M60 70V38" stroke="#5fbf86" stroke-width="4" stroke-linecap="round"/>
        <g fill="#86d6a4" stroke="#4b3f5c" stroke-width="2.5">
          <ellipse cx="60" cy="34" rx="10" ry="18"/>
          <ellipse cx="43" cy="50" rx="8" ry="18" transform="rotate(-45 43 50)"/>
          <ellipse cx="77" cy="50" rx="8" ry="18" transform="rotate(45 77 50)"/>
        </g>
        <path d="M36 78H84L79 111Q78 116 73 116H47Q42 116 41 111Z" fill="#f7c4a8" stroke="#4b3f5c" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="30" y="64" width="60" height="15" rx="7" fill="#f4b393" stroke="#4b3f5c" stroke-width="2.5"/>
        <circle cx="50" cy="93" r="2.8" fill="#4b3f5c"/><circle cx="70" cy="93" r="2.8" fill="#4b3f5c"/>
        <ellipse cx="44" cy="100" rx="4.5" ry="3" fill="#ff9fb8" opacity=".8"/>
        <ellipse cx="76" cy="100" rx="4.5" ry="3" fill="#ff9fb8" opacity=".8"/>
        <path d="M54 100Q60 107 66 100" stroke="#4b3f5c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="shd"></div>
    <div class="wm">Plant Pal</div>
    <div class="ln"><i></i></div>
    <div class="pc"></div>
    <div class="msg">
      <span class="m1">Waking up the seeds…</span>
      <span class="m2">Filling the watering can…</span>
      <span class="m3">Polishing the pots…</span>
      <span class="m4">Almost blooming… 🌸</span>
    </div>
  </div>

  <!-- Your app goes here -->
  <main class="page">
    <h1>🌱 Welcome to Plant Pal</h1>
    <p>The loading screen has faded out. Refresh the page to watch it again.</p>
  </main>

</body>
</html>
